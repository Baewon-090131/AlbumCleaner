<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="creative-medium" content="interactive-prototype">
  <title>Album Cleaner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      /* v2.7「液态玻璃 2.0」壁纸：四层柔光斑 + 线性底。
         这是壁纸的唯一定义处；body 与页面转场背板都引用它，
         避免两处写法漂移导致转场接缝露出色差 */
      --wall:
        radial-gradient(120% 78% at 6% -8%, #6FA8FF 0%, rgba(255,255,255,0) 58%),
        radial-gradient(104% 68% at 98% 4%, #C3A2FF 0%, rgba(255,255,255,0) 54%),
        radial-gradient(90% 60% at 78% 62%, rgba(110,214,255,0.55) 0%, rgba(255,255,255,0) 62%),
        radial-gradient(126% 92% at 46% 106%, #FFB0D8 0%, rgba(255,255,255,0) 58%),
        linear-gradient(168deg, #E7F0FF 0%, #F1EBFF 46%, #FFF0F8 100%);
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, "SF Pro", "SF Pro Display", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--wall);
      background-attachment: fixed;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    .app-root {
      width: 100%;
      height: 100%;
    }
    img {
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }
    /* 隐藏滚动条（iOS 风格） */
    ::-webkit-scrollbar { display: none; }
    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      /* 消除 300ms 点击延迟（本页面自带手势，不需要双击缩放） */
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <!-- React（本地文件，离线可用） -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>

  <!-- 原生桥接接口 -->
  <script>
    window.NativeBridge = {
      _data: null,
      _listeners: [],
      receiveData: function(data) {
        this._data = data;
        this._listeners.forEach(function(cb) { cb(data); });
        this._listeners = [];
      },
      getData: function(callback) {
        if (this._data) {
          callback(this._data);
        } else {
          this._listeners.push(callback);
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.photoApp) {
            window.webkit.messageHandlers.photoApp.postMessage({ action: 'getData' });
          }
        }
      },
      deleteAssets: function(identifiers) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.photoApp) {
          window.webkit.messageHandlers.photoApp.postMessage({ action: 'deleteAssets', identifiers: identifiers });
        }
      },
      setFavorite: function(identifier, favorite) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.photoApp) {
          window.webkit.messageHandlers.photoApp.postMessage({ action: 'setFavorite', identifier: identifier, favorite: favorite });
        }
      },
      addToAlbum: function(assetIdentifier, albumIdentifier) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.photoApp) {
          window.webkit.messageHandlers.photoApp.postMessage({ action: 'addToAlbum', assetIdentifier: assetIdentifier, albumIdentifier: albumIdentifier });
        }
      },
      playMedia: function(identifier) {
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.photoApp) {
          window.webkit.messageHandlers.photoApp.postMessage({ action: 'playMedia', identifier: identifier });
        }
      },
      isNative: function() {
        return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.photoApp);
      }
    };
  </script>

  <!-- 数据 -->
  <script src="data.js"></script>

  <!-- 预编译组件（普通JS，无运行时Babel依赖） -->
  <script src="build/SwipeCardStack.js"></script>
  <script src="build/HomePage.js"></script>
  <script src="build/SortBottomBar.js"></script>
  <script src="build/SortPage.js"></script>
  <script src="build/TrashPage.js"></script>
  <script src="build/SettingsPage.js"></script>
  <script src="build/App.js"></script>

  <div id="root"></div>

  <!-- 主入口（含错误边界） -->
  <script src="build/main.js"></script>
</body>
</html>

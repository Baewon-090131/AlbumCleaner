name: AlbumCleaner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  AlbumCleaner:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Evernight
        excludes:
          - Info.plist
          - WebContent
      - path: Evernight/WebContent
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.albumcleaner
        PRODUCT_NAME: AlbumCleaner
        MARKETING_VERSION: "3.0"
        CURRENT_PROJECT_VERSION: "11"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Evernight/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO

# 显式生成共享 Scheme，确保 xcodebuild -scheme AlbumCleaner 可用
schemes:
  AlbumCleaner:
    build:
      targets:
        AlbumCleaner: all
    run:
      config: Debug
    archive:
      config: Release
